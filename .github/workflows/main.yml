name: TIME PARKIN - Package iOS IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  package-ipa:
    name: 📦 Package iOS IPA for GBox & Sideload
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup App Bundle & POSIX Permissions
        run: |
          mkdir -p Payload/TimeParkin.app
          if [ -d "SOURCE_CODE/CLOCK_SYSTEM" ]; then
            BASE="SOURCE_CODE"
          else
            BASE="."
          fi
          if [ -f "$BASE/CLOCK_SYSTEM/Info.plist" ]; then
            cp "$BASE/CLOCK_SYSTEM/Info.plist" Payload/TimeParkin.app/Info.plist
          fi
          echo -n "APPL????" > Payload/TimeParkin.app/PkgInfo
          if [ -d "$BASE/CLOCK_SYSTEM" ]; then
            cp -r "$BASE/CLOCK_SYSTEM" Payload/TimeParkin.app/ || true
          fi
          chmod -R 755 Payload
          zip -r TIME_PARKIN_GBOX_READY.ipa Payload

      - name: 3. Upload IPA for Download
        uses: actions/upload-artifact@v4
        with:
          name: TIME_PARKIN_GBOX_READY_IPA
          path: "*.ipa"
          retention-days: 30
